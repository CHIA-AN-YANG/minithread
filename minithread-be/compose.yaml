services:
  app:
    build: .
    container_name: minithread-backend
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "8080:8080"
      - "443:443"
    environment:
      SPRING_CONFIG_LOCATION: /app/application.properties
      PRIVATE_PEM_PATH: classpath:certs/private.pem
      PUBLIC_PEM_PATH: classpath:certs/public.pem
  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:7.17.10'
    environment:
      - 'ELASTIC_PASSWORD=secret'
      - 'discovery.type=single-node'
      - 'xpack.security.enabled=false'
    ports:
      - '9200:9200'
      - '9300:9300'
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=thread_db'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=root'
    ports:
      - '5432:5432'
    volumes:
      - thread_db:/var/lib/postgresql/data # Mount the volume to PostgreSQL's data directory
  rabbitmq:
    image: 'rabbitmq:3-management'
    container_name: rabbitmq
    ports:
      - '5672:5672'        # AMQP protocol port
      - '15672:15672'      # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  redis:
    image: 'redis:latest'
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
volumes:
  thread_db:
    driver: local
  redis_data:
    driver: local